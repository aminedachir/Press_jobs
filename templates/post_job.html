{% extends 'base.html' %}
{% block title %}نشر وظيفة - PressJobs{% endblock %}
{% block extra_css %}
<style>
.post-layout { max-width: 700px; margin: 0 auto; padding: 3rem 2rem; }
.post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; }
.post-header { text-align: center; margin-bottom: 2.5rem; }
.post-header i { font-size: 3rem; color: var(--orange); margin-bottom: 1rem; }
.post-header h1 { font-size: 1.7rem; font-weight: 900; }
.post-header p { color: var(--text-muted); margin-top: 0.5rem; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media(max-width:600px) { .form-row { grid-template-columns: 1fr; } }
@media(max-width:480px) {
    .post-layout { padding: 1.5rem 1rem; }
    .post-card { padding: 1.5rem 1.2rem; border-radius: 16px; }
    .post-header i { font-size: 2.2rem; }
    .post-header h1 { font-size: 1.4rem; }
}
</style>
{% endblock %}
{% block content %}
<div class="post-layout">
    <div class="post-card">
        <div class="post-header">
            <i class="fas fa-plus-circle"></i>
            <h1>نشر وظيفة جديدة</h1>
            <p>أضف تفاصيل الوظيفة للوصول إلى أفضل الكوادر الإعلامية</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-heading"></i> عنوان الوظيفة *</label>
                <input type="text" name="title" required placeholder="مثال: مصور صحفي ميداني">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> التخصص *</label>
                    <select name="category" required>
                        <option value="">اختر التخصص</option>
                        <option value="journalist">صحفي</option>
                        <option value="photographer">مصور</option>
                        <option value="content">صانع محتوى</option>
                        <option value="editor">مونتير</option>
                        <option value="presenter">مذيع</option>
                        <option value="reporter">مراسل</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-clock"></i> نوع العمل</label>
                    <select name="job_type">
                        <option value="">اختر نوع العمل</option>
                        <option value="دوام كامل">دوام كامل</option>
                        <option value="دوام جزئي">دوام جزئي</option>
                        <option value="مستقل">مستقل / فريلانس</option>
                        <option value="عقد مؤقت">عقد مؤقت</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> الموقع</label>
                    <input type="text" name="location" placeholder="مثال: القاهرة، عن بُعد">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-dollar-sign"></i> الراتب (اختياري)</label>
                    <input type="text" name="salary" placeholder="مثال: 5000-8000 دولار">
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-align-right"></i> وصف الوظيفة *</label>
                <textarea name="description" required rows="5" placeholder="اكتب وصفاً تفصيلياً للوظيفة ومهام الشخص المطلوب..."></textarea>
            </div>
            <div class="form-group">
                <label><i class="fas fa-list-check"></i> المتطلبات والمؤهلات</label>
                <textarea name="requirements" rows="4" placeholder="اذكر المهارات والخبرات والمؤهلات المطلوبة..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:1rem;font-size:1rem">
                <i class="fas fa-paper-plane"></i> نشر الوظيفة
            </button>
        </form>
    </div>
</div>
{% endblock %}
