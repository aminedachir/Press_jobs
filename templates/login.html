{% extends 'base.html' %}
{% block title %}تسجيل الدخول - PressJobs{% endblock %}
{% block extra_css %}
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background: var(--gradient-hero); }
.auth-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo img { height: 70px; }
.auth-logo h2 { font-size: 1.5rem; font-weight: 900; margin-top: 0.7rem; }
.auth-logo p { color: var(--text-muted); font-size: 0.9rem; }
.auth-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; }
.auth-footer a { color: var(--orange); text-decoration: none; font-weight: 600; }
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="/static/images/logo.png" alt="PressJobs">
            <h2>تسجيل الدخول</h2>
            <p>مرحباً بعودتك إلى PressJobs</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" name="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" name="password" required placeholder="كلمة المرور">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:1rem;font-size:1rem;margin-top:0.5rem">
                <i class="fas fa-sign-in-alt"></i> دخول
            </button>
        </form>
        <div class="auth-footer">
            ليس لديك حساب؟ <a href="/register">إنشاء حساب جديد</a>
        </div>
    </div>
</div>
{% endblock %}
